<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="練唱KTV">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon.png">
<title>練唱KTV</title>
<style>
:root {
  /* 跟 Mac 版練唱KTV 同一組深色：背景、文字、重點色，其他由這三個配出來 */
  --bg: #141219;
  --bar: #1c1922;
  --card: #26222c;
  --line: #3d3844;
  --text: #ECE8DF;
  --dim: #9C968E;
  --gold: #F2C14E;
  --on-gold: #2A1D05;
  --paused: #BD5433;
  --paused-text: #FFEDE0;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "PingFang TC", "Heiti TC", system-ui, sans-serif;
  /* 版面：上方標題列／中間大字歌詞（可捲動）／進度條／下方一排大按鈕 */
  --lyric: 50px;
  --ruby: 0.5;
  --mincho: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Songti TC", serif;
  --jpfont: var(--font); --trfont: var(--font);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font);
  -webkit-user-select: none; user-select: none; overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
button { font-family: var(--font); color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.view { position: fixed; inset: 0; display: none; flex-direction: column; }
.view.on { display: flex; }

/* ── 歌單 ── */
.list-head {
  display: flex; align-items: center; gap: 14px; padding: 20px 24px;
  background: linear-gradient(90deg, #2b2416, var(--bar)); border-bottom: 1px solid var(--line);
}
.logo {
  width: 52px; height: 52px; border-radius: 50%; background: var(--gold); color: var(--on-gold);
  display: grid; place-items: center; flex: none;
}
.list-head h1 { margin: 0; font-size: 32px; color: var(--gold); letter-spacing: 2px; }
.list-head p { margin: 0; font-size: 20px; color: var(--dim); }
.songs { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 24px; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 18px; align-content: start; }
.song {
  display: flex; align-items: center; gap: 18px; padding: 20px 22px; background: var(--card);
  border: 1.5px solid var(--line); border-radius: 18px;
}
.song .no { font-size: 30px; font-weight: 700; color: var(--dim); width: 40px; text-align: center; flex: none; }
.song .info { flex: 1; min-width: 0; }
.song .t { font-size: 34px; font-weight: 700; line-height: 1.3; }
.song .a { font-size: 22px; color: var(--dim); margin-top: 4px; }
.song .go {
  flex: none; font-size: 28px; font-weight: 700; padding: 18px 30px; border-radius: 16px; border: 0;
  background: var(--gold); color: var(--on-gold);
}
.empty { font-size: 26px; color: var(--dim); text-align: center; padding: 60px 20px; grid-column: 1 / -1; }

/* ── 唱歌 ── */
.lyrics { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; padding: 0 28px; }
.lyrics .pad-top { height: 16vh; }
.lyrics .pad-bottom { height: 45vh; }
.ln { padding: calc(var(--lyric) * 0.2) 0; text-align: center; border-radius: 16px; border: 2px solid transparent; transition: opacity .25s; }
.ln.far { opacity: .4; }
.ln.loop { background: rgba(242,193,78,.14); border-color: rgba(242,193,78,.7); }
.ln .jp { font-family: var(--jpfont); font-size: var(--lyric); font-weight: 500; line-height: 1.55; color: var(--text);
  word-break: keep-all; overflow-wrap: normal; line-break: strict; }
.ln.cur .jp { font-size: calc(var(--lyric) * 1.12); font-weight: 800; color: var(--gold); }
.ln rt { font-size: calc(var(--ruby) * 1em); font-weight: 500; opacity: .9; }
.ln .tr { font-family: var(--trfont); font-size: calc(var(--lyric) * 0.55); color: var(--dim); line-height: 1.4; margin-top: 2px; }

/* 最下面一條：左回歌單、中間六顆、右⚙ */
.stage { flex: 1; min-height: 0; position: relative; display: flex; }
.lyrics.has-vox { padding: 0 120px; }
.vox { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 92px; padding: 14px 0 16px;
  background: rgba(28,25,34,.92); border: 1.5px solid var(--line); border-radius: 22px;
  display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 2; }
.vox[hidden] { display: none; }
.vox-t { font-size: 18px; font-weight: 700; color: var(--dim); }
.vox-track { position: relative; width: 64px; height: min(42vh, 330px); touch-action: none; cursor: pointer; }
.vox-track:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; border-radius: 12px; }
.vox-rail { position: absolute; left: 50%; top: 0; bottom: 0; width: 12px; transform: translateX(-50%); border-radius: 6px; background: var(--line); overflow: hidden; }
.vox-rail i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--gold); }
.vox-ticks b { position: absolute; left: 50%; width: 26px; height: 3px; margin-bottom: -1.5px; transform: translateX(-50%); background: var(--dim); border-radius: 2px; opacity: .55; }
.vox-thumb { position: absolute; left: 50%; width: 50px; height: 50px; margin-bottom: -25px; transform: translateX(-50%);
  border-radius: 50%; background: var(--gold); border: 4px solid var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.5); pointer-events: none; }
.vox-v { font-size: 26px; font-weight: 800; color: var(--gold); min-height: 34px; font-variant-numeric: tabular-nums; }
@media (max-width: 900px) { .lyrics.has-vox { padding: 0 104px; } .vox { width: 80px; right: 8px; } }
.dock { position: relative; flex: none; background: var(--bar); border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 12px 14px 14px; }
.dock .buttons { flex: 1; min-width: 0; }
.prog { position: absolute; left: 0; right: 0; top: -1px; height: 5px; background: var(--line); }
.prog i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); }
.time { position: absolute; right: 14px; top: -28px; font-size: 15px; color: var(--dim); font-variant-numeric: tabular-nums;
  background: rgba(20,18,25,.8); padding: 2px 8px; border-radius: 8px; }
.sq { width: 84px; height: 68px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 16px; font-weight: 700; }
.sq svg { width: 26px; height: 26px; }
.sq.on { border-color: var(--gold); color: var(--gold); }
.buttons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.big {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 68px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-size: 17px; font-weight: 700; white-space: nowrap;
}
.big svg { width: 26px; height: 26px; }
.big.primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.big.pausedst { background: var(--paused); border-color: var(--paused); color: var(--paused-text); }
.big.active { border: 3px solid var(--gold); color: var(--gold); }
.big:disabled { opacity: .35; }
@media (max-width: 900px) {
  .dock { gap: 8px; padding: 10px 10px 12px; }
  .sq { width: 70px; font-size: 14px; }
    .buttons { gap: 6px; }
  .big { font-size: 14px; }
}

/* ⚙ 小視窗：在右下、⚙ 的上方，不蓋住 ⚙ */
.pop { position: absolute; right: 14px; bottom: calc(100% + 12px); width: 380px; max-width: calc(100vw - 28px);
  background: var(--bar); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px;
  display: none; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5); z-index: 4; }
.pop.on { display: flex; }
.pop::after { content: ""; position: absolute; right: 34px; bottom: -9px; width: 16px; height: 16px; background: var(--bar);
  border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); transform: rotate(45deg); }
.prow { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 10px; }
.prow > span { font-size: 17px; color: var(--dim); }
.step { display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 8px; }
.step button, .seg button { height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 19px; font-weight: 700; }
.step b { text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button.on { border-color: var(--gold); color: var(--gold); }
.seg .mincho { font-family: var(--mincho); font-weight: 600; }

/* 速度選單、唱完了 */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 5; }
.sheet.on { display: flex; }
.panel { background: var(--bar); border: 1.5px solid var(--line); border-radius: 24px; padding: 28px; width: min(92vw, 460px); display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0 0 6px; font-size: 28px; text-align: center; }
.opt { display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 700; padding: 18px 22px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); }
.opt span { color: var(--dim); font-size: 22px; font-weight: 500; }
.opt.on { border-color: var(--gold); color: var(--gold); }
.done h2 { font-size: 44px; color: var(--gold); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.loading[hidden] { display: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: var(--dim); background: var(--bg); }
@media (prefers-reduced-motion: reduce) { .ln { transition: none; } }
.song { flex-wrap: wrap; }
.song .go:disabled { opacity: .35; }
.opt.primary-opt { background: var(--gold); border-color: var(--gold); color: var(--on-gold); justify-content: center; }
.row2 .opt { justify-content: center; font-size: 22px; }
.msg { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); max-width: 80%; background: var(--bar); border: 1.5px solid var(--line); border-radius: 18px; padding: 22px 26px; font-size: 24px; text-align: center; line-height: 1.5; }
.msg[hidden] { display: none; }
</style>
</head>
<body>
<!-- 歌單 -->
<section class="view on" id="listView" aria-label="歌單">
  <header class="list-head">
    <div class="logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
    </div>
    <div>
      <h1>練唱KTV</h1>
      <p>選一首歌，跟著唱</p>
    </div>
  </header>
  <div class="songs" id="songs"><div class="empty">歌單載入中…</div></div>
</section>

<!-- 唱歌 -->
<section class="view" id="singView" aria-label="唱歌">
  <div class="stage">
    <div class="lyrics" id="lyrics"></div>
    <div class="vox" id="vox" hidden>
      <div class="vox-t">人聲</div>
      <div class="vox-track" id="voxTrack" role="slider" aria-label="人聲大小" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5" tabindex="0">
        <div class="vox-rail"><i id="voxFill"></i></div>
        <div class="vox-ticks"><b style="bottom:100%"></b><b style="bottom:80%"></b><b style="bottom:60%"></b><b style="bottom:40%"></b><b style="bottom:20%"></b><b style="bottom:0%"></b></div>
        <div class="vox-thumb" id="voxThumb"></div>
      </div>
      <div class="vox-v" id="voxVal">5</div>
    </div>
  </div>
  <div class="dock">
    <div class="prog"><i id="barFill"></i></div>
    <div class="time"><span id="tNow">0:00</span> / <span id="tAll">0:00</span></div>
    <button class="sq" id="backBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>回歌單</button>
    <div class="buttons">
    <button class="big" id="bRestart" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg>從頭唱</button>
    <button class="big" id="bPrev" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg>上一句</button>
    <button class="big" id="bLoop" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/><path d="M11.5 10.5L13 9.5v5"/></svg><span id="loopLabel">重複這句</span></button>
    <button class="big pausedst" id="bPlay" type="button"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg><span id="playLabel">已暫停</span></button>
    <button class="big" id="bNext" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h2"/></svg>下一句</button>
    <button class="big" id="bSpeed" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3.5 15a8.5 8.5 0 1 1 17 0"/><path d="M12 15l-4-5"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/></svg><span id="speedLabel">速度 原速</span></button>
  </div>
    <button class="sq" id="gearBtn" type="button" aria-expanded="false" aria-controls="pop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>設定</button>
    <div class="pop" id="pop" role="dialog" aria-label="設定">
      <div class="prow"><span>歌詞</span><div class="step"><button class="sz" type="button" data-k="lyric" data-d="-1">A−</button><b id="lyricVal"></b><button class="sz" type="button" data-k="lyric" data-d="1">A+</button></div></div>
      <div class="prow"><span>假名</span><div class="step"><button class="sz" type="button" data-k="ruby" data-d="-1">A−</button><b id="rubyVal"></b><button class="sz" type="button" data-k="ruby" data-d="1">A+</button></div></div>
      <div class="prow"><span>字體</span><div class="seg"><button type="button" data-f="gothic">黑體</button><button type="button" data-f="mincho" class="mincho">明體</button></div></div>
      <div class="prow"><span>翻譯</span><div class="seg"><button type="button" data-t="1">顯示</button><button type="button" data-t="0">不顯示</button></div></div>
    </div>
  </div>
  <div class="loading" id="loading" hidden>歌曲載入中…</div>
  <div class="msg" id="msg" hidden></div>
</section>

<div class="sheet" id="speedSheet" role="dialog" aria-label="唱歌速度">
  <div class="panel" id="speedPanel"><h2>唱歌速度</h2></div>
</div>

<div class="sheet" id="doneSheet" role="dialog" aria-label="唱完了">
  <div class="panel done">
    <h2>唱完了！</h2>
    <div class="row2">
      <button class="big primary" id="dAgain" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>再唱一次</button>
      <button class="big" id="dBack" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>回歌單</button>
    </div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const audio = $("audio");

  // ── 設定（存在這台 iPad 上） ──
  const store = {
    get(k, d) { try { const v = localStorage.getItem("ktv." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { if (v === undefined) localStorage.removeItem("ktv." + k); else localStorage.setItem("ktv." + k, JSON.stringify(v)); } catch (e) {} }
  };
  const S = {
    lyric: store.get("lyric", 1.0),     // 歌詞大小倍數（1.0 = 50px）
    ruby: store.get("ruby", 1.0),       // 假名大小倍數
    tr: store.get("tr", true),          // 顯示翻譯
    font: store.get("font", "gothic"),  // 字體：gothic 黑體、mincho 明體
    vocal: store.get("vocal", 5),       // 人聲大小 0～5（0＝只有伴奏）
    rate: store.get("rate", 1.0),       // 速度
    loopPause: 1.0                      // 重複這句：每次之間停 1 秒
  };
  const SILENT = "data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";

  // ── 假名標音：漢字{かな}、｜混合{よみ}（跟 App 同一套規則） ──
  const isKanji = c => { const v = c.codePointAt(0);
    return (v >= 0x4E00 && v <= 0x9FFF) || (v >= 0x3400 && v <= 0x4DBF) || (v >= 0xF900 && v <= 0xFAFF) || v === 0x3005 || v === 0x30F6 || v === 0x3006; };
  function parseRuby(s) {
    const chars = Array.from(s), segs = []; let pending = [], marker = null, i = 0;
    const flush = n => { if (n > 0) segs.push({ base: pending.slice(0, n).join(""), r: null }); pending = pending.slice(n); };
    while (i < chars.length) {
      const c = chars[i];
      if (c === "|" || c === "｜") { marker = pending.length; i++; continue; }
      if (c === "{" || c === "｛") {
        let j = i + 1;
        while (j < chars.length && chars[j] !== "}" && chars[j] !== "｝") j++;
        if (j < chars.length) {
          const reading = chars.slice(i + 1, j).join("");
          let start = pending.length;
          if (marker !== null) start = marker; else while (start > 0 && isKanji(pending[start - 1])) start--;
          if (start < pending.length && reading) {
            flush(start); segs.push({ base: pending.join(""), r: reading }); pending = []; marker = null; i = j + 1; continue;
          }
        }
      }
      pending.push(c); i++;
    }
    if (pending.length) segs.push({ base: pending.join(""), r: null });
    return segs;
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = s => parseRuby(s).map(x => x.base).join("");
  function lineHTML(text, notes) {
    const ranges = (notes || []).filter(n => n.start <= n.end).map(n => [n.start, n.end]);
    const hit = (a, b) => ranges.some(([s, e]) => a <= e && b >= s);
    let pos = 0, out = "";
    for (const seg of parseRuby(text)) {
      const chs = Array.from(seg.base);
      if (seg.r) {
        out += `<ruby${hit(pos, pos + chs.length - 1) ? ' class="u"' : ""}>${esc(seg.base)}<rt>${esc(seg.r)}</rt></ruby>`;
        pos += chs.length;
      } else {
        for (const ch of chs) { out += hit(pos, pos) ? `<span class="u">${esc(ch)}</span>` : esc(ch); pos++; }
      }
    }
    return out;
  }
  const fmt = s => { if (!isFinite(s) || s < 0) s = 0; const t = Math.floor(s); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };

  // 聲音來源：單一歌曲檔，或人聲＋伴奏兩個檔。對外用法一樣
  const fileSrc = {
    kind: "file",
    time: () => audio.currentTime,
    duration: () => (isFinite(audio.duration) ? audio.duration : 0),
    paused: () => audio.paused,
    play() { const p = audio.play(); if (p) p.catch(() => {}); },
    pause() { audio.pause(); },
    seek(t) { try { audio.currentTime = Math.max(0, t); } catch (e) {} },
    setRate(r) { audio.playbackRate = r; audio.defaultPlaybackRate = r; audio.preservesPitch = true; audio.webkitPreservesPitch = true; },
    stop() { audio.pause(); audio.removeAttribute("src"); audio.load(); }
  };
  let src = fileSrc;
  // 人聲＋伴奏分開的兩個檔：一起播，人聲音量可以調（0＝只有伴奏）
  const vAud = new Audio(), iAud = new Audio();
  for (const a of [vAud, iAud]) { a.preload = "auto"; a.setAttribute("playsinline", ""); }
  let actx = null, vGain = null;
  const VOL = [0, 0.12, 0.25, 0.45, 0.7, 1];
  function ensureGraph() {
    if (actx) { if (actx.state !== "running") actx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      actx = new AC();
      vGain = actx.createGain();
      actx.createMediaElementSource(vAud).connect(vGain).connect(actx.destination);
      actx.createMediaElementSource(iAud).connect(actx.destination);
      setVocal(S.vocal);
    } catch (e) { actx = null; vGain = null; }
  }
  function setVocal(n) {
    if (vGain) vGain.gain.value = VOL[n];
    else vAud.volume = VOL[n];      // 沒有 Web Audio 時的備用（iPad 不吃這個）
  }
  const stemSrc = {
    kind: "stem", lastSync: 0,
    time: () => iAud.currentTime,
    duration: () => (isFinite(iAud.duration) ? iAud.duration : 0),
    paused: () => iAud.paused,
    play() {
      ensureGraph();
      try { vAud.currentTime = iAud.currentTime; } catch (e) {}
      for (const a of [iAud, vAud]) { const p = a.play(); if (p) p.catch(() => {}); }
    },
    pause() { iAud.pause(); vAud.pause(); },
    seek(t) { t = Math.max(0, t); try { iAud.currentTime = t; vAud.currentTime = t; } catch (e) {} },
    setRate(r) { for (const a of [iAud, vAud]) { a.playbackRate = r; a.defaultPlaybackRate = r; a.preservesPitch = true; a.webkitPreservesPitch = true; } },
    // 兩個檔偶爾會跑掉一點點，差超過 0.08 秒就把人聲拉回來
    sync() {
      const now = performance.now(); if (now - this.lastSync < 500) return; this.lastSync = now;
      if (!iAud.paused && !vAud.seeking && Math.abs(vAud.currentTime - iAud.currentTime) > 0.08) {
        try { vAud.currentTime = iAud.currentTime; } catch (e) {}
      }
      if (!iAud.paused && vAud.paused) { const p = vAud.play(); if (p) p.catch(() => {}); }
    },
    stop() { for (const a of [iAud, vAud]) { a.pause(); a.removeAttribute("src"); a.load(); } }
  };
  iAud.addEventListener("ended", () => { if (src === stemSrc) { vAud.pause(); onEnded(); } });
  iAud.addEventListener("loadedmetadata", () => { if (src === stemSrc && song) $("tAll").textContent = fmt(iAud.duration); });
  iAud.addEventListener("pause", updateButtons);
  iAud.addEventListener("play", updateButtons);

  // 人聲拉霸
  function showVocal() {
    const n = S.vocal;
    $("voxThumb").style.bottom = (n * 20) + "%";
    $("voxFill").style.height = (n * 20) + "%";
    $("voxVal").textContent = n === 0 ? "伴唱" : n;
    $("voxTrack").setAttribute("aria-valuenow", n);
  }
  function setVocalLevel(n) {
    n = Math.max(0, Math.min(5, n));
    if (n === S.vocal) return;
    S.vocal = n; store.set("vocal", n); setVocal(n); showVocal();
  }
  (() => {
    const tr = $("voxTrack"); let drag = false;
    const levelAt = y => { const r = tr.getBoundingClientRect(); return Math.round((1 - (y - r.top) / r.height) * 5); };
    tr.addEventListener("pointerdown", e => { drag = true; try { tr.setPointerCapture(e.pointerId); } catch (x) {} setVocalLevel(levelAt(e.clientY)); e.preventDefault(); });
    tr.addEventListener("pointermove", e => { if (drag) setVocalLevel(levelAt(e.clientY)); });
    const end = () => { drag = false; };
    tr.addEventListener("pointerup", end); tr.addEventListener("pointercancel", end);
    tr.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") { setVocalLevel(S.vocal + 1); e.preventDefault(); }
      if (e.key === "ArrowDown" || e.key === "ArrowLeft") { setVocalLevel(S.vocal - 1); e.preventDefault(); }
    });
  })();


  // ── 歌單 ──
  let songs = [];
  async function loadList() {
    try { songs = (await (await fetch("songs/index.json", { cache: "no-cache" })).json()).songs || []; }
    catch (e) { songs = []; }
    renderList();
  }
  function renderList() {
    const box = $("songs");
    if (!songs.length) { box.innerHTML = '<div class="empty">還沒有歌</div>'; return; }
    box.innerHTML = songs.map((s, i) => {
      const playable = !!s.audio || !!(s.vocal && s.inst);
      return `<div class="song">
        <div class="no">${i + 1}</div>
        <div class="info"><div class="t">${esc(s.title)}</div>${s.artist ? `<div class="a">${esc(s.artist)}</div>` : ""}</div>
        <button class="go" type="button" data-i="${i}"${playable ? "" : " disabled"}>練唱</button>
      </div>`;
    }).join("");
  }
  $("songs").addEventListener("click", e => {
    const g = e.target.closest(".go"); if (g && !g.disabled) openSong(+g.dataset.i);
  });

  // ── 唱歌 ──
  const cache = new Map();
  let meta = null, song = null, lines = [], rows = [], cur = null, loopLine = null, waiting = false, waitTimer = null,
      guardUntil = 0, objectURL = null, stemURLs = [], wakeLock = null, loadToken = 0;

  async function openSong(i) {
    meta = songs[i]; if (!meta) return;
    const token = ++loadToken;
    show("singView");
    $("lyrics").innerHTML = ""; $("loading").textContent = "歌曲載入中…"; $("loading").hidden = false; hideMsg();
    resetState();
    const stems = !!(meta.vocal && meta.inst);
    src = stems ? stemSrc : fileSrc;
    closePop();
    $("vox").hidden = !stems; $("lyrics").classList.toggle("has-vox", stems); showVocal();
    // iPad 只允許「點一下」當下開始出聲：先在點擊時播一段無聲的音，之後換成歌曲才能自動播放
    if (stems) {
      ensureGraph();
      for (const a of [iAud, vAud]) { a.src = SILENT; const p = a.play(); if (p) p.catch(() => {}); }
    } else { audio.src = SILENT; const p = audio.play(); if (p) p.catch(() => {}); }
    try {
      const c = cache.get(meta.dir);
      const sj = c && c.sj ? c.sj : await (await fetch(`songs/${meta.dir}/song.json`)).json();
      let blob = c && c.blob, vBlob = c && c.vBlob, iBlob = c && c.iBlob;
      if (stems && !(vBlob && iBlob)) {
        [vBlob, iBlob] = await Promise.all([meta.vocal, meta.inst].map(async f => (await fetch(`songs/${meta.dir}/${f}`)).blob()));
      } else if (!stems && !blob) blob = await (await fetch(`songs/${meta.dir}/${meta.audio || sj.audio}`)).blob();
      cache.set(meta.dir, { sj, blob, vBlob, iBlob });
      if (token !== loadToken) return;
      song = sj; lines = sj.lines || [];
      buildLyrics();
      $("tAll").textContent = fmt(sj.duration);
      if (stems) {
        iAud.pause(); vAud.pause();
        for (const u of stemURLs) URL.revokeObjectURL(u);
        stemURLs = [URL.createObjectURL(iBlob), URL.createObjectURL(vBlob)];
        iAud.src = stemURLs[0]; vAud.src = stemURLs[1];
        applyRate();
        $("loading").hidden = true;
        play();
      } else {
        audio.pause();
        if (objectURL) URL.revokeObjectURL(objectURL);
        objectURL = URL.createObjectURL(blob);
        audio.src = objectURL;
        applyRate();
        $("loading").hidden = true;
        play();
      }
      updateButtons();
    } catch (e) {
      $("loading").textContent = "歌曲讀不到，請確認網路後回歌單再試一次。";
    }
  }
  function resetState() {
    clearWait(); cur = null; loopLine = null; guardUntil = 0;
    try { src.pause(); } catch (e) {}
    $("doneSheet").classList.remove("on");
  }
  function closeSong() {
    loadToken++; resetState(); closePop(); fileSrc.stop(); stemSrc.stop();
    song = null; lines = []; rows = []; releaseWake(); show("listView");
  }
  function show(id) { for (const v of document.querySelectorAll(".view")) v.classList.toggle("on", v.id === id); }
  function showMsg(t) { $("msg").textContent = t; $("msg").hidden = false; $("loading").hidden = true; }
  function hideMsg() { $("msg").hidden = true; }

  function buildLyrics() {
    const box = $("lyrics");
    let html = '<div class="pad-top"></div>';
    lines.forEach((l, i) => {
      html += `<div class="ln" data-i="${i}"><div class="jp">${lineHTML(l.text, null)}</div>${
        l.translation ? `<div class="tr"${S.tr ? "" : " hidden"}>${esc(l.translation)}</div>` : ""}</div>`;
    });
    html += '<div class="pad-bottom"></div>';
    box.innerHTML = html;
    rows = Array.from(box.querySelectorAll(".ln"));
    markRows(); fitAll(); box.scrollTop = 0;
  }
  // 歌詞只在打空白的地方換行；連一段都放不下時，把那一句縮小到放得下，不從字中間斷開
  function fitRow(r) {
    const e = r && r.firstElementChild; if (!e) return;
    e.style.fontSize = "";
    if (e.scrollWidth > e.clientWidth + 1) {
      const px = parseFloat(getComputedStyle(e).fontSize);
      e.style.fontSize = Math.floor(px * e.clientWidth / e.scrollWidth * 0.98) + "px";
    }
  }
  function fitAll() { rows.forEach(fitRow); }
  window.addEventListener("resize", () => { fitAll(); requestAnimationFrame(scrollToCur); });
  $("lyrics").addEventListener("click", e => {
    const r = e.target.closest(".ln"); if (!r) return;
    const i = +r.dataset.i; if (T(i) !== null) jump(i);
  });

  const T = i => (lines[i] && lines[i].time != null ? lines[i].time : null);
  const timed = () => lines.some(l => l.time != null);
  function currentIndex(t) {
    const now = t + 0.05; let best = null, bt = -Infinity;
    for (let i = 0; i < lines.length; i++) { const x = T(i); if (x !== null && x <= now && x >= bt) { best = i; bt = x; } }
    return best;
  }
  function totalDur() { return src.duration() || (song ? song.duration : 0); }
  function range(i) {
    const s = T(i); if (s === null) return null;
    let end = totalDur() || s + 5;
    for (let j = i + 1; j < lines.length; j++) { const x = T(j); if (x !== null && x > s) { end = x; break; } }
    return [s, Math.max(end, s + 0.3)];
  }
  function markRows() {
    rows.forEach((r, i) => {
      const was = r.classList.contains("cur");
      r.classList.toggle("cur", cur === i);
      if (was !== (cur === i)) fitRow(r);
      r.classList.toggle("far", cur !== null && Math.abs(cur - i) > 1);
      r.classList.toggle("loop", loopLine === i);
    });
  }
  function scrollToCur() {
    if (cur === null || !rows[cur]) return;
    const box = $("lyrics"), r = rows[cur];
    const top = r.offsetTop - box.clientHeight * 0.38 + r.offsetHeight / 2;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    box.scrollTo({ top: Math.max(0, top), behavior: reduce ? "auto" : "smooth" });
  }

  // 播放控制
  const speedChoices = () => [0.6, 0.7, 0.8, 0.9, 1.0];
  function nearestRate(r) { const c = speedChoices(); return c.reduce((a, b) => (Math.abs(b - r) < Math.abs(a - r) ? b : a), c[c.length - 1]); }
  function applyRate() { src.setRate(nearestRate(S.rate)); }
  const isPlaying = () => !src.paused() || waiting;
  function play() { $("doneSheet").classList.remove("on"); hideMsg(); applyRate(); src.play(); holdWake(); updateButtons(); }
  function pause() { clearWait(); src.pause(); updateButtons(); }
  function togglePlay() { if (isPlaying()) pause(); else play(); }
  function seek(t) { src.seek(t); tick(true, t); }
  function restart() {
    clearWait(); loopLine = null;
    let first = Infinity; for (let i = 0; i < lines.length; i++) { const x = T(i); if (x !== null) first = Math.min(first, x); }
    seek(isFinite(first) ? first : 0); guardUntil = performance.now() + 300; play(); markRows();
  }
  function jump(i) {
    const r = range(i); if (!r) return;
    clearWait(); if (loopLine !== null) loopLine = i;
    seek(r[0]); guardUntil = performance.now() + 300; play(); markRows();
  }
  function prevLine() {
    const c = currentIndex(src.time()) ?? 0, r = range(c);
    if (r && src.time() - r[0] > 1.0) { jump(c); return; }
    let j = c - 1; while (j >= 0 && T(j) === null) j--;
    jump(Math.max(j, 0));
  }
  function nextLine() {
    let j = (currentIndex(src.time()) ?? -1) + 1;
    while (j < lines.length && T(j) === null) j++;
    if (j < lines.length) jump(j);
  }
  function toggleLoop() {
    if (loopLine !== null) {
      const was = waiting; loopLine = null; clearWait();
      if (was) play();
    } else {
      let c = currentIndex(src.time());
      if (c === null) c = lines.findIndex(l => l.time != null);
      if (c === null || c < 0) return;
      loopLine = c;
      if (!isPlaying()) { const r = range(c); seek(r[0]); guardUntil = performance.now() + 300; play(); }
    }
    markRows(); updateButtons();
  }
  function clearWait() { waiting = false; if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; } }
  function restartLoop(start) {
    if (S.loopPause > 0) {
      waiting = true; src.pause();
      waitTimer = setTimeout(() => {
        waitTimer = null; if (!waiting) return; waiting = false;
        seek(start); guardUntil = performance.now() + 300; play();
      }, S.loopPause * 1000);
    } else { seek(start); guardUntil = performance.now() + 300; }
  }
  function onEnded() {
    if (!song) return;
    if (loopLine !== null) { const r = range(loopLine); if (r) { restartLoop(r[0]); return; } }
    updateButtons(); releaseWake(); $("doneSheet").classList.add("on");
  }

  // 每一格畫面：換句、進度條、單句重複
  let lastBar = -1;
  function tick(force, at) {
    if (!song) return;
    if (src === stemSrc) stemSrc.sync();
    const t = at !== undefined ? at : src.time();
    if (!waiting || force) {
      const c = currentIndex(t);
      if (c !== cur) { cur = c; markRows(); scrollToCur(); }
      const d = totalDur(), w = d > 0 ? Math.min(1, t / d) : 0;
      if (Math.abs(w - lastBar) > 0.001 || force) { $("barFill").style.width = (w * 100) + "%"; $("tNow").textContent = fmt(t); lastBar = w; }
    }
    if (loopLine !== null && !waiting && !src.paused() && performance.now() >= guardUntil) {
      const r = range(loopLine); if (r && t >= r[1] - 0.04) restartLoop(r[0]);
    }
  }
  (function loop() { tick(false); requestAnimationFrame(loop); })();
  audio.addEventListener("ended", () => { if (src === fileSrc && audio.src === objectURL) onEnded(); });
  audio.addEventListener("loadedmetadata", () => { if (src === fileSrc && song && audio.src === objectURL) $("tAll").textContent = fmt(audio.duration); });
  audio.addEventListener("pause", updateButtons);
  audio.addEventListener("play", updateButtons);

  function updateButtons() {
    const playing = isPlaying(), ok = timed();
    const b = $("bPlay");
    b.classList.toggle("primary", playing); b.classList.toggle("pausedst", !playing);
    $("playLabel").textContent = playing ? "暫停" : "已暫停";
    $("playIcon").innerHTML = playing ? '<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>' : '<path d="M7 4v16l13-8z"/>';
    for (const id of ["bPrev", "bNext", "bLoop"]) $(id).disabled = !ok;
    $("bLoop").classList.toggle("active", loopLine !== null);
    $("loopLabel").textContent = loopLine !== null ? "重複中" : "重複這句";
    const r = song ? nearestRate(S.rate) : S.rate;
    $("bSpeed").classList.toggle("active", r < 0.99);
    $("speedLabel").textContent = r > 0.99 ? "速度 原速" : "速度 " + r + "倍";
    document.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", (b.dataset.t === "1") === S.tr));
    document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b.dataset.f === S.font));
  }

  // 螢幕不要自己變暗（iPad 有支援才會生效）
  async function holdWake() { try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {} }
  function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && song && isPlaying()) holdWake(); });

  // ⚙ 設定小視窗：字的大小、字體、翻譯、對時間
  function applySizes() {
    const root = document.documentElement.style;
    root.setProperty("--lyric", (50 * S.lyric) + "px");
    root.setProperty("--ruby", (0.5 * S.ruby).toFixed(3));
    root.setProperty("--jpfont", S.font === "mincho" ? "var(--mincho)" : "var(--font)");
    root.setProperty("--trfont", S.font === "mincho" ? "var(--mincho)" : "var(--font)");
    $("lyricVal").textContent = Math.round(S.lyric * 100) + "%";
    $("rubyVal").textContent = Math.round(S.ruby * 100) + "%";
    fitAll(); requestAnimationFrame(scrollToCur);
  }
  document.querySelectorAll(".sz").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k, d = +b.dataset.d;
    S[k] = Math.round(Math.min(2.0, Math.max(0.6, S[k] + d * 0.1)) * 10) / 10;
    store.set(k, S[k]); applySizes();
  }));
  document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    S.font = b.dataset.f; store.set("font", S.font); applySizes(); updateButtons();
  }));
  document.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
    S.tr = b.dataset.t === "1"; store.set("tr", S.tr);
    document.querySelectorAll(".ln .tr").forEach(e => { e.hidden = !S.tr; });
    updateButtons(); requestAnimationFrame(scrollToCur);
  }));
  const pop = $("pop"), gear = $("gearBtn");
  function closePop() { pop.classList.remove("on"); gear.classList.remove("on"); gear.setAttribute("aria-expanded", "false"); }
  gear.addEventListener("click", e => {
    e.stopPropagation();
    const on = !pop.classList.contains("on");
    pop.classList.toggle("on", on); gear.classList.toggle("on", on); gear.setAttribute("aria-expanded", String(on));
  });
  pop.addEventListener("click", e => e.stopPropagation());
  document.addEventListener("click", e => { if (pop.classList.contains("on") && !pop.contains(e.target)) closePop(); });
  // 速度
  const NAMES = { 0.6: "很慢", 0.7: "慢", 0.8: "稍慢", 0.9: "有點慢", 1: "原速" };
  function buildSpeeds() {
    const now = nearestRate(S.rate);
    $("speedPanel").innerHTML = "<h2>唱歌速度</h2>" + speedChoices().map(v =>
      `<button class="opt${Math.abs(now - v) < 0.01 ? " on" : ""}" type="button" data-v="${v}">${NAMES[v] || ""}<span>${v} 倍</span></button>`).join("");
  }
  $("bSpeed").addEventListener("click", () => { buildSpeeds(); $("speedSheet").classList.add("on"); });
  $("speedSheet").addEventListener("click", e => {
    const o = e.target.closest(".opt");
    if (o) { S.rate = +o.dataset.v; store.set("rate", S.rate); applyRate(); updateButtons(); }
    $("speedSheet").classList.remove("on");
  });

  $("backBtn").addEventListener("click", closeSong);
  $("bRestart").addEventListener("click", restart);
  $("bPrev").addEventListener("click", prevLine);
  $("bNext").addEventListener("click", nextLine);
  $("bLoop").addEventListener("click", toggleLoop);
  $("bPlay").addEventListener("click", togglePlay);
  $("dAgain").addEventListener("click", restart);
  $("dBack").addEventListener("click", closeSong);
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && song) { e.preventDefault(); togglePlay(); }
    if (e.key === "Escape") closePop();
  });

  applySizes(); updateButtons(); loadList();
})();
</script>
</body>
</html>
